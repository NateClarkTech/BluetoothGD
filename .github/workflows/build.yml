name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  CMAKE_BUILD_PARALLEL_LEVEL: 2

jobs:
  linux-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev pkg-config ninja-build

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DGODOTCPP_TARGET=template_debug

      - name: Build extension
        run: cmake --build build --target bluetooth_manager --parallel ${{ env.CMAKE_BUILD_PARALLEL_LEVEL }}

      - name: Build unit tests
        run: cmake --build build --target bluetooth_manager_tests --parallel ${{ env.CMAKE_BUILD_PARALLEL_LEVEL }}

      - name: Run unit tests
        run: ./build/tests/bluetooth_manager_tests

  verify-linux-shipping:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install verification tools
        run: sudo apt-get update && sudo apt-get install -y binutils python3 libdbus-1-3

      - name: Verify committed Linux shipping binaries
        run: |
          chmod +x scripts/verify-linux-binaries.sh
          ./scripts/verify-linux-binaries.sh

      - name: Confirm addon and demo Linux binaries match
        run: |
          cmp addons/bluetooth_gd/bin/libbluetooth_manager.linux.template_release.x86_64.so \
             demo/addons/bluetooth_gd/bin/libbluetooth_manager.linux.template_release.x86_64.so
          cmp addons/bluetooth_gd/bin/libbluetooth_manager.linux.template_debug.x86_64.so \
             demo/addons/bluetooth_gd/bin/libbluetooth_manager.linux.template_debug.x86_64.so

  linux-docker-build:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build Linux binaries (Ubuntu 20.04 Docker)
        run: |
          chmod +x scripts/build-linux-docker.sh scripts/verify-linux-binaries.sh
          ./scripts/build-linux-docker.sh

  build-windows:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DGODOTCPP_TARGET=template_debug

      - name: Build extension
        run: cmake --build build --config Debug --target bluetooth_manager --parallel ${{ env.CMAKE_BUILD_PARALLEL_LEVEL }}

      - name: Build unit tests
        run: cmake --build build --config Debug --target bluetooth_manager_tests --parallel ${{ env.CMAKE_BUILD_PARALLEL_LEVEL }}

      - name: Run unit tests
        run: ./build/tests/Debug/bluetooth_manager_tests.exe

      - name: Verify extension output
        run: |
          Get-ChildItem build/bin/libbluetooth_manager.windows.template_debug.x86_64.dll
          Get-ChildItem addons/bluetooth_gd/bin/libbluetooth_manager.windows.template_debug.x86_64.dll
          Get-ChildItem demo/addons/bluetooth_gd/bin/libbluetooth_manager.windows.template_debug.x86_64.dll